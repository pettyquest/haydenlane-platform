<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F0" />
    <title>Hayden Lane Field OS</title>
    <meta name="description" content="Hayden Lane Field OS: builders, lots, bids, crews and invoicing for Hayden Lane Drywall." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Added to an iPhone's Home Screen: its name there, and the status bar above the page rather than over it (a see-through one has white text, lost on the light theme). -->
    <meta name="apple-mobile-web-app-title" content="Hayden Lane" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The page's own color (--page in src/styles/tokens.css) from the first paint, so opening the app never flashes white in dark mode. -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #111110; color-scheme: dark; }
      /* Hayden Lane fork: product name, colors and mark are also in packages/core/src/brand.ts, src/brand/theme.css and public/brand/. */
      /* A booking form inside the business's own website (?embed=1) sits on that site's background, with no logo while it loads. */
      html.embedded, html.embedded body { background: transparent; }
      html.embedded .boot { display: none; }
    </style>
    <script>
      // Light or dark before first paint (src/lib/theme.ts keeps it up to date). Client pages stay light.
      try {
        var theme = localStorage.getItem("crewtavo.theme");
        if (!/^\/(hub|book|u|refer|s|g)\//.test(location.pathname) && (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141513");
        }
      } catch (e) {}
      // The language chosen on this phone (src/lib/i18n.tsx), for screen readers from the start.
      try {
        if (localStorage.getItem("crewtavo.locale") === "es" && !/^\/(hub|book|u|refer|s|g)\//.test(location.pathname)) document.documentElement.lang = "es";
      } catch (e) {}
      if (/^\/book\//.test(location.pathname) && /[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add("embedded");
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Hayden Lane">
        <img class="boot-mark" src="/brand/mark-128.png" width="48" height="48" alt="" />
      </div>
    </div>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
      .boot-mark { width: 48px; height: 48px; border-radius: 22%; background: #000; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1); opacity: 1; } }
      .dark .boot { background: #111110; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
